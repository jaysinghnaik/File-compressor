<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" cx="50%" cy="0%" r="95%" fx="50%" fy="0%">
      <stop offset="0%" stop-color="#1e1e38" />
      <stop offset="100%" stop-color="#090915" />
    </linearGradient>

    <!-- Fuchsia Glow Gradient -->
    <linearGradient id="fuchsia-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f43f5e" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>

    <!-- Violet Glow Gradient -->
    <linearGradient id="violet-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#a855f7" />
    </linearGradient>
    
    <!-- Neon Drop Shadow -->
    <filter id="neon-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#7c3aed" flood-opacity="0.45" />
    </filter>
  </defs>

  <!-- Rounded Outer Tile (Squircle style matching Android adaptive icon base) -->
  <rect x="24" y="24" width="464" height="464" rx="108" fill="url(#bg-grad)" stroke="#2e2e50" stroke-width="4" />

  <!-- Grid Pattern Elements to look cool & technical -->
  <circle cx="256" cy="256" r="180" fill="none" stroke="#2a254c" stroke-width="2" stroke-dasharray="8 8" opacity="0.6" />
  <line x1="256" y1="76" x2="256" y2="436" stroke="#2a254c" stroke-width="1.5" stroke-dasharray="6 6" opacity="0.4" />
  <line x1="76" y1="256" x2="436" y2="256" stroke="#2a254c" stroke-width="1.5" stroke-dasharray="6 6" opacity="0.4" />

  <!-- Glowing Visual Compound: Documents & Vice Grippers -->
  <g filter="url(#neon-glow)">
    <!-- Back Page (JPG/PNG visual document representation) -->
    <rect x="180" y="140" width="168" height="220" rx="16" fill="url(#fuchsia-grad)" opacity="0.85" transform="rotate(-6 264 250)" />
    <!-- Back Page Fold corner -->
    <path d="M312 140 L348 176 L312 176 Z" fill="#fff" opacity="0.2" transform="rotate(-6 264 250)" />

    <!-- Front Page (PDF Document representation) -->
    <rect x="160" y="160" width="168" height="220" rx="16" fill="url(#violet-grad)" stroke="#ffffff" stroke-width="2" />
    <!-- Page Corner fold -->
    <path d="M292 160 L328 196 L292 196 Z" fill="#ffffff" opacity="0.4" />
    
    <!-- Flat design paper lines inside PDF representation -->
    <line x1="192" y1="230" x2="270" y2="230" stroke="#ffffff" stroke-width="6" stroke-linecap="round" opacity="0.8" />
    <line x1="192" y1="260" x2="296" y2="260" stroke="#ffffff" stroke-width="6" stroke-linecap="round" opacity="0.8" />
    <line x1="192" y1="290" x2="280" y2="290" stroke="#ffffff" stroke-width="6" stroke-linecap="round" opacity="0.8" />

    <!-- Compression Clamps/Brackets hugging the sides -->
    <path d="M110 180 L80 180 L80 340 L110 340" fill="none" stroke="#22d3ee" stroke-width="10" stroke-linecap="round" />
    <path d="M378 180 L408 180 L408 340 L378 340" fill="none" stroke="#22d3ee" stroke-width="10" stroke-linecap="round" />

    <!-- Inward compression arrows indicating reduction/squeezing -->
    <path d="M124 260 L100 244 L100 276 Z" fill="#22d3ee" />
    <line x1="60" y1="260" x2="108" y2="260" stroke="#22d3ee" stroke-width="6" stroke-linecap="round" />

    <path d="M364 260 L388 244 L388 276 Z" fill="#22d3ee" transform="rotate(180 376 260)" />
    <line x1="428" y1="260" x2="380" y2="260" stroke="#22d3ee" stroke-width="6" stroke-linecap="round" />
  </g>
</svg>
